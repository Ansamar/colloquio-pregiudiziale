<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7a1f2b">
<link rel="icon" href="icona-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Colloquio pregiudiziale – Tribunale Ecclesiastico Partenopeo</title>
<style>
:root{
  --ink:#1f2328; --muted:#5d6670; --line:#d9dde2; --bg:#f6f5f2; --card:#ffffff;
  --accent:#7a1f2b; --accent-ink:#ffffff; --accent-soft:#f4e9ea; --flag:#9a5b00; --flag-soft:#fff4e0; --flag-ink:#6b4a10; --ok:#2f6b3a;
  --field:#ffffff; --hover:#f1f1ef; --chip:#eef0f3; --chip-ink:#46505a;
  --note:#fbfaf6; --note-line:#cbbfa8; --note-ink:#6d5a2e; --info:#eef4ef; --info-line:#cfe0d2; --info-ink:#24502c; --warn-line:#f0d9ac;
  --focus:#c9a3a8; color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#e4e4e1; --muted:#a2a9b0; --line:#3a3f46; --bg:#17191c; --card:#212428;
  --accent:#e3909b; --accent-ink:#1b1d20; --accent-soft:#3a2328; --flag:#e6ac55; --flag-soft:#352a17; --flag-ink:#f0cf98; --ok:#72c483;
  --field:#1b1e21; --hover:#2a2e33; --chip:#30353b; --chip-ink:#c4cad0;
  --note:#25231e; --note-line:#5e533b; --note-ink:#d8c79f; --info:#1d2e22; --info-line:#2f4d36; --info-ink:#a8d8b2; --warn-line:#5a4723;
  --focus:#7a4a52; color-scheme:dark;
}
:root[data-theme="dark"] #brandLogo{background:#fff;border-radius:50%;padding:3px;box-sizing:content-box}
.theme{grid-column:1/3;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.theme button{flex:1;border:0!important;border-radius:0!important;background:transparent!important;color:var(--muted);padding:5px 4px!important;font-size:12px!important}
.theme button.on{background:var(--accent-soft)!important;color:var(--accent);font-weight:600}
.genrow{display:flex;gap:6px}.genrow input{flex:1}
.genrow button{border:1px solid var(--accent);background:var(--card);color:var(--accent);border-radius:6px;padding:0 10px;font-size:12.5px;white-space:nowrap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.brand img{display:block;width:56px;height:57px;margin:0 auto 8px}
.brand{text-align:center}
.brand b{display:block;color:var(--accent);font-family:Georgia,"Times New Roman",serif;font-size:14px;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.case{height:58px;overflow:hidden;padding:10px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.case strong{color:var(--ink)}
nav{overflow:auto;flex:1;padding:6px 0}
nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 18px;font-size:13.5px;color:var(--ink)}
nav button:hover{background:var(--hover)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav .num{width:20px;color:var(--muted);font-size:12px;flex:none}
nav .lbl{flex:1}
nav .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);flex:none}
nav .dot.part{background:linear-gradient(90deg,var(--muted) 50%,transparent 50%)}
nav .dot.full{background:var(--ok);border-color:var(--ok)}
nav .flagc{background:var(--flag-soft);color:var(--flag);border-radius:9px;padding:0 6px;font-size:11px;flex:none}
.tools{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px;font-size:12.5px}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.status{grid-column:1/3;font-size:11.5px;color:var(--muted);text-align:center;padding-top:2px}
main{overflow:auto;min-height:0}
.wrap{max-width:900px;margin:0 auto;padding:26px 28px 80px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:20px;margin:0 0 4px;color:var(--accent)}
.intro{color:var(--muted);margin:0 0 18px;font-size:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.q.flagged{border-left:4px solid var(--flag)}
.q > label.ql{display:block;font-weight:600;margin-bottom:6px}
.help{font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.capi{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 8px}
.capi span{font-size:11px;background:var(--chip);color:var(--chip-ink);border-radius:10px;padding:1px 8px}
input[type=text],input[type=date],input[type=tel],input[type=email],textarea,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--field);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--focus);border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.opts label{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer}
.opts.col{flex-direction:column;gap:5px}
.dual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.det{margin-top:8px;padding:10px;background:var(--flag-soft);border-radius:6px}
.det .dl{font-size:12.5px;color:var(--flag-ink);margin-bottom:5px}
.det select{margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fieldsm label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.note{background:var(--note);border:1px dashed var(--note-line)}
.note > label.ql{color:var(--note-ink)}
.pager{display:flex;justify-content:space-between;margin-top:20px}
.pager button,.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 16px}
.pager button.sec,.btn.sec{background:var(--card);color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
.info{background:var(--info);border:1px solid var(--info-line);color:var(--info-ink);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.warn{background:var(--flag-soft);border:1px solid var(--warn-line);color:var(--flag-ink);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:14px}
.testi .t{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.testi .t .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.testi .t .hd button{border:0;background:none;color:#a33;font-size:13px}
.grid-gap{display:grid;gap:8px}
.ind h3{font-size:14px;margin:10px 0 4px;color:var(--flag)}
.ind ul{margin:0 0 6px;padding-left:20px;font-size:13.5px}
.reportbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
#report{background:#fff;color:#1f2328;border:1px solid var(--line);padding:48px 56px;font-family:Georgia,"Times New Roman",serif;font-size:12.5pt;line-height:1.5}
/* ---- report typography (also exported to Word) ---- */
.r-head{text-align:center;margin-bottom:22px}
.r-logo{display:block;margin:0 auto 10px;width:90px;height:92px}
.r-head .t1{font-size:12.5pt;font-weight:bold;letter-spacing:.06em;text-transform:uppercase}
.r-head .t2{font-size:10pt;font-style:italic;margin-top:2px}
.r-head hr{border:0;border-top:1px solid #000;margin:12px 0}
.r-head .t3{font-size:11.5pt;font-weight:bold;letter-spacing:.04em;margin-top:14px}
.r-head .t4{font-size:10.5pt;margin-top:4px}
.r-h2{font-size:11pt;font-weight:bold;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px;border-bottom:1px solid #999;padding-bottom:2px}
.r-h3{font-size:11pt;font-weight:bold;font-style:italic;margin:14px 0 4px}
.r-q{margin:0 0 8px}
.r-q .rq{font-weight:bold}
.r-tab{border-collapse:collapse;width:100%;font-size:11pt}
.r-tab td,.r-tab th{border:1px solid #888;padding:4px 6px;vertical-align:top;text-align:left}
.r-tab th{background:#eee}
.r-sign{margin-top:36px;display:flex;justify-content:space-between;page-break-inside:avoid}
.r-foot{margin-top:30px;font-size:9.5pt;color:#444;border-top:1px solid #999;padding-top:6px;font-style:italic}
.r-obs{font-style:italic;color:#333}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:20px 22px;max-width:440px;width:calc(100% - 40px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal p{margin:0 0 16px;white-space:pre-line}
.modal .fieldsm{margin-bottom:10px}
.modal h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;color:var(--accent);font-size:18px;margin:0 0 6px}
.modal .mb{display:flex;justify-content:flex-end;gap:8px}
@media print{
  @page{size:A4;margin:2cm}
  body{background:#fff;color:#000}
  .app{display:block;height:auto}
  aside,.reportbar,.noprint{display:none!important}
  main{overflow:visible}
  .wrap{max-width:none;padding:0}
  #report{border:0;padding:0}
  .r-h2{page-break-after:avoid}
}
@media (max-width:900px){.app{grid-template-columns:220px 1fr}.dual,.row2,.row3{grid-template-columns:1fr}}
</style>
</head>

<div class="app">
  <aside>

      <input type="file" id="fileIn" accept=".docx,.json" hidden>

  <main id="main"><div class="wrap" id="wrap"></div></main>
</div>

/* ================= STATO ================= */
const LS_KEY = "tep_colloquio_pratica_v1";
let state = blank();
let cur = 0;
function blank(){ return {v:{}, testi:[], a14:{}, ver:1}; }
function load(){ try{ const s = localStorage.getItem(LS_KEY); if(s){ const o = JSON.parse(s); if(o && o.v) state = o; } }catch(e){} }
let saveT=null;
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus("Salvato su questo computer alle "+new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})); }
    catch(e){ setStatus("Salvataggio automatico non disponibile: usare «Salva pratica (Word)»"); }
  },300);
}
function setStatus(t){ document.getElementById("status").textContent=t; }

/* ================= UTILITÀ ================= */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl2br = s => esc(s).replace(/\n/g,"<br>");
const rlab = l => l.replace(/\s*\((anche più d'uno)\)/,"");
const keyOf = (sid,fid,side) => sid+"."+fid+(side?"."+side:"");
const fkey = (s,f,side) => f.key || keyOf(s.id,f.id,side);
const val = k => state.v[k];
function fmtDate(d){ if(!d) return ""; const p=d.split("-"); return p.length===3? p[2]+"/"+p[1]+"/"+p[0] : d; }
function filled(x){ return Array.isArray(x)? x.length>0 : (x!=null && String(x).trim()!==""); }
function nameD(){ return [val("dich.nome"),val("dich.cognome")].filter(Boolean).join(" ") || "Il dichiarante"; }
function nameC(){ return [val("coni.nome"),val("coni.cognome")].filter(Boolean).join(" ") || "L'altro coniuge"; }
const SIDE_LBL = {d:"Dichiarante", c:"Altro coniuge"};
function sideName(s){ return s==="d"? nameD()+" (dichiarante)" : nameC()+" (coniuge)"; }
function durata(){
  const a=val("cel.dataNozze"), b=val("vita.sepFatto"); if(!a||!b) return null;
  const d1=new Date(a), d2=new Date(b); if(isNaN(d1)||isNaN(d2)||d2<d1) return null;
  let m=(d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth()); if(d2.getDate()<d1.getDate()) m--;
  const y=Math.floor(m/12), r=m%12;
  return {mesi:m, txt:(y? y+(y===1?" anno":" anni"):"")+(y&&r?" e ":"")+(r? r+(r===1?" mese":" mesi"):"")+(m===0?"meno di un mese":"")};
}

/* ================= INDICATORI ================= */
function sidesOf(f){ return f.dual? ["d","c"] : [null]; }
function computeFlags(){
  const out=[];
  for(const s of S){ if(!s.fields) continue;
    for(const f of s.fields){
      for(const side of sidesOf(f)){
        const k=fkey(s,f,side), v=val(k);
        if(f.type==="yn" && v===SI && (f.capi||f.a14)){
          out.push({s,f,side,capi:f.capi||[],a14:f.a14,det:val(k+".det"),t:val(k+".t")});
        } else if(f.type==="choice" && v && ((f.flag&&f.flag[v])||(f.a14map&&f.a14map[v]))){
          out.push({s,f,side,capi:(f.flag&&f.flag[v])||[],a14:f.a14map&&f.a14map[v],det:v});
        } else if(f.type==="checks" && Array.isArray(v)){
          for(const o of v){ if((f.flag&&f.flag[o])||(f.a14map&&f.a14map[o])) out.push({s,f,side,capi:(f.flag&&f.flag[o])||[],a14:f.a14map&&f.a14map[o],det:o}); }
        }
      }
    }
  }
  return out;
}
function flagsByCapo(fl){ const m={}; for(const x of fl) for(const c of x.capi){ (m[c]=m[c]||[]).push(x); } return m; }
function suggestedA14(fl){ const m={}; for(const x of fl) if(x.a14) m[x.a14]=true; const d=durata(); if(d && d.mesi<12) m.brevita=true; return m; }
function isFieldFlagged(s,f){ return computeFlags().some(x=>x.s===s && x.f===f); }

/* ================= RENDER: NAVIGAZIONE ================= */
function sectionProgress(s){
  if(s.special==="testi") return {n:state.testi.length?1:0,t:1};
  if(s.special==="val") return {n:filled(val("val.testo"))?1:0,t:1};
  let n=0,t=0;
  for(const f of s.fields){ if(f.key||(f.showIf&&!f.showIf())) continue; for(const side of sidesOf(f)){ t++; if(filled(val(keyOf(s.id,f.id,side)))) n++; } }
  return {n,t};
}
function renderNav(){
  const fl=computeFlags();
  const nav=document.getElementById("nav");
  if(!nav.dataset.built){
    let h="";
    S.forEach((s,i)=>{ h+=`<button data-go="${i}"><span class="num">${i+1}</span><span class="lbl">${esc(s.title)}</span><span class="flagc" title="Elementi segnalati"></span><span class="dot"></span></button>`; });
    h+=`<button data-go="report"><span class="num">▤</span><span class="lbl"><b>Rapporto per il Tribunale</b></span></button>`;
    nav.innerHTML=h; nav.dataset.built="1";
  }

  const btns=nav.querySelectorAll("button");

    const dt=b.querySelector(".dot"); dt.classList.toggle("full", p.n>0&&p.n===p.t); dt.classList.toggle("part", p.n>0&&p.n<p.t);
  });

  cb.innerHTML = (val("dich.cognome")||val("coni.cognome"))
    ? `<strong>${esc(nameD())}</strong> – ${esc(nameC())}${val("proc.prot")?`<br>Prot. ${esc(val("proc.prot"))}`:""}`
    : "Nuova pratica";
}

/* ================= RENDER: CAMPI ================= */
function control(s,f,side){
  const k=fkey(s,f,side), v=val(k);
  switch(f.type){
    case "text": case "date": case "tel": case "email":
      return `<input type="${f.type}" data-k="${k}" value="${esc(v)}">`;
    case "textarea":
      return `<textarea data-k="${k}">${esc(v)}</textarea>`;
    case "choice":
      return `<div class="opts ${f.opts.length>3?"col":""}">`+f.opts.map(o=>`<label><input type="radio" name="${k}" data-k="${k}" value="${esc(o)}" ${v===o?"checked":""}> ${esc(o)}</label>`).join("")+`</div>`;
    case "checks": {
      const arr=Array.isArray(v)?v:[];
      return `<div class="opts col">`+f.opts.map(o=>`<label><input type="checkbox" data-k="${k}" data-multi="1" value="${esc(o)}" ${arr.includes(o)?"checked":""}> ${esc(o)}</label>`).join("")+`</div>`;
    }
    case "yn": {
      let h=`<div class="opts">`+[SI,NO,NS].map(o=>`<label><input type="radio" name="${k}" data-k="${k}" value="${o}" ${v===o?"checked":""}> ${o}</label>`).join("")+`</div>`;
      if(v===SI){
        h+=`<div class="det"><div class="dl">${esc(f.det||"Descriva i fatti: che cosa, quando, chi era presente.")}</div><textarea data-k="${k}.det">${esc(val(k+".det"))}</textarea>`;
        if(f.tempo){
          const t=val(k+".t")||"";
          h+=`<select data-k="${k}.t"><option value="">Quando si colloca il fatto?</option>`+["Prima delle nozze","Al momento delle nozze","Dopo le nozze","Prima e dopo le nozze"].map(o=>`<option ${t===o?"selected":""}>${o}</option>`).join("")+`</select>`;
        }
        h+=`</div>`;
      }
      return h;
    }
  }
  return "";
}
function fieldBlock(s,f){
  const flagged=isFieldFlagged(s,f);
  let h=`<div class="q ${flagged?"flagged":""}"><label class="ql">${esc(f.label)}</label>`;
  if(f.help) h+=`<div class="help">${esc(f.help)}</div>`;
  const caps=new Set(f.capi||[]); if(f.flag) Object.values(f.flag).forEach(a=>a.forEach(c=>caps.add(c)));
  if(caps.size) h+=`<div class="capi">`+[...caps].map(c=>`<span title="${esc(CAPI[c])}">${esc(CAPI[c].replace(/ \(.*\)$/,""))}</span>`).join("")+`</div>`;
  if(f.dual){
    h+=`<div class="dual">`+["d","c"].map(sd=>`<div class="side"><h4>${sd==="d"?esc(nameD())+" · dichiarante":esc(nameC())+" · coniuge"}</h4>${control(s,f,sd)}</div>`).join("")+`</div>`;
  } else h+=control(s,f,null);
  return h+`</div>`;
}
function shortBlock(s,f){
  const c=control(s,f,null);
  return `<div class="fieldsm"><label>${esc(f.label)}</label>${f.gen?`<div class="genrow">${c}<button id="genProt" title="Cognome dell'attore, data del colloquio, sigla del consulente">Genera protocollo</button></div>`:c}</div>`;
}

function renderSection(){
  const wrap=document.getElementById("wrap");
  if(cur==="report"){ renderReportView(); return; }
  const s=S[cur];
  let h=`<h1>${esc(s.title)}</h1>`;
  if(s.intro) h+=`<p class="intro">${esc(s.intro)}</p>`;
  if(s.special==="testi") h+=testiHTML();
  else if(s.special==="val") h+=valHTML();
  else{
    // campi brevi raggruppati in griglia
    let buf=[];
    const flush=()=>{ if(buf.length){ h+=`<div class="q"><div class="row2">${buf.join("")}</div></div>`; buf=[]; } };
    for(const f of s.fields){
      if(f.showIf && !f.showIf()) continue;
      if(f.short && !f.dual) buf.push(shortBlock(s,f));
      else { flush(); h+=fieldBlock(s,f); }
    }
    flush();
    if(s.id==="vita"){ const d=durata(); if(d) h+=`<div class="info">Durata della convivenza coniugale (dalle nozze alla separazione di fatto): <b>${esc(d.txt)}</b>${d.mesi<12?" — rilevante per l'art. 14 delle Regole procedurali.":""}</div>`; }
  }
  if(!s.special || s.special==="testi"){
    const nk="_note."+s.id;
    h+=`<div class="q note"><label class="ql">Osservazioni del consulente su questa sezione</label><div class="help">Impressioni, coerenza del racconto, punti da verificare. Entrano nel rapporto solo se lo si sceglie nella sezione Valutazione.</div><textarea data-k="${nk}">${esc(val(nk))}</textarea></div>`;
  }
  h+=`<div class="pager noprint"><button class="sec" data-go="${cur>0?cur-1:0}" ${cur===0?"style='visibility:hidden'":""}>← ${cur>0?esc(S[cur-1].title):""}</button>`+
     (cur<S.length-1? `<button data-go="${cur+1}">${esc(S[cur+1].title)} →</button>` : `<button data-go="report">Rapporto per il Tribunale →</button>`)+`</div>`;
  wrap.innerHTML=h;
}

function valHTML(){
  const fl=computeFlags(), by=flagsByCapo(fl), sug=suggestedA14(fl);
  let h=`<div class="q ind"><label class="ql">Quadro degli elementi emersi</label><div class="help">Riepilogo automatico delle risposte segnalate, raggruppate per capo. È un promemoria per il consulente, non una valutazione.</div>`;
  const keys=Object.keys(CAPI).filter(c=>by[c]);
  if(!keys.length) h+=`<p style="margin:4px 0;color:var(--muted)">Nessun elemento segnalato finora.</p>`;
  for(const c of keys){
    h+=`<h3>${esc(CAPI[c])} · ${by[c].length}</h3><ul>`+by[c].map(x=>`<li>${esc(x.f.label)}${x.side?` <i>(${esc(SIDE_LBL[x.side].toLowerCase())})</i>`:""}${x.det&&x.f.type!=="yn"?": "+esc(x.det):""}</li>`).join("")+`</ul>`;
  }
  h+=`</div>`;
  h+=`<div class="q"><label class="ql">Circostanze dell'art. 14 §1 delle Regole procedurali</label><div class="help">Utili a valutare il processo più breve davanti al Vescovo. Le voci con ◆ sono suggerite dalle risposte: confermarle solo se verificate.</div><div class="opts col">`;
  for(const [k,l] of Object.entries(ART14)) h+=`<label><input type="checkbox" data-a14="${k}" ${state.a14[k]?"checked":""}> ${sug[k]?"<b style='color:var(--flag)'>◆</b> ":""}${esc(l)}</label>`;
  h+=`</div></div>`;
  const es=val("val.esito")||"";
  h+=`<div class="q"><label class="ql">Esito del colloquio (facoltativo)</label><div class="opts col">`+
     ["Non indicare","Sono emersi elementi che suggeriscono di procedere alla redazione del libello","Gli elementi emersi richiedono ulteriore approfondimento","Allo stato non sono emersi elementi sufficienti"].map(o=>`<label><input type="radio" name="val.esito" data-k="val.esito" value="${esc(o)}" ${es===o?"checked":""}> ${esc(o)}</label>`).join("")+`</div></div>`;
  h+=`<div class="q"><label class="ql">Valutazione conclusiva del consulente</label><div class="help">Testo che compare nel rapporto. Il pulsante propone una bozza neutra a partire dagli elementi emersi, da rivedere e correggere.</div><textarea data-k="val.testo" style="min-height:200px">${esc(val("val.testo"))}</textarea><div style="margin-top:8px"><button class="btn sec small" id="bozza">Proponi una bozza</button></div></div>`;
  h+=`<div class="q"><div class="row2"><div class="fieldsm"><label>Luogo della relazione</label><input type="text" data-k="val.luogo" value="${esc(val("val.luogo")||CONFIG.luogoFirma)}"></div><div class="fieldsm"><label>Data della relazione</label><input type="date" data-k="val.data" value="${esc(val("val.data")||new Date().toISOString().slice(0,10))}"></div></div>`+
     `<label style="display:flex;gap:8px;margin-top:12px;font-size:14px"><input type="checkbox" data-k="val.includiNote" data-bool="1" ${val("val.includiNote")?"checked":""}> Includere nel rapporto le osservazioni del consulente scritte nelle singole sezioni</label></div>`;
  return h;
}
function bozza(){
  const fl=computeFlags(), by=flagsByCapo(fl), keys=Object.keys(CAPI).filter(c=>by[c]);
  const data=fmtDate(val("proc.dataColl"));
  let t=`Dal colloquio con ${nameD()}${data?", svoltosi il "+data:""}, `;
  if(keys.length){
    t+=`sono emersi elementi che, salvo il più approfondito esame del Tribunale, appaiono meritevoli di attenzione con riferimento ai seguenti possibili capi di nullità:\n`;
    keys.forEach(c=>{ t+=`– ${CAPI[c]}\n`; });
    t+=`\nTali elementi si fondano sulla dichiarazione della parte e richiedono riscontro mediante le deposizioni delle persone indicate`;
    t+= state.testi.length? ` (${state.testi.length})` : "";
    t+=` e la documentazione disponibile. Ogni valutazione sulla loro rilevanza giuridica resta rimessa al Tribunale.`;
  } else {
    t+=`non sono emersi, allo stato, elementi specifici riconducibili ai capi di nullità previsti dal Codice. Si resta a disposizione per un eventuale ulteriore approfondimento.`;
  }
  return t;
}

/* ================= RAPPORTO ================= */
function answerText(s,f,side){
  const k=fkey(s,f,side), v=val(k);
  if(!filled(v)) return "";
  if(f.type==="date") return esc(fmtDate(v));
  if(f.type==="checks") return esc(v.join("; "));
  if(f.type==="yn"){
    let t=esc(v); const d=val(k+".det"), tm=val(k+".t");
    if(tm) t+=` <i>(${esc(tm.toLowerCase())})</i>`;
    if(filled(d)) t+=`. `+nl2br(d);
    return t;
  }
  return nl2br(v);
}
function reportHTML(){
  const fl=computeFlags(), by=flagsByCapo(fl), d=durata();
  const prot=val("proc.prot"), parte=val("proc.parte");
  let h=`<div class="r-head"><img class="r-logo" src="${LOGO}" width="90" height="92" alt="Logo"><div class="t1">${esc(CONFIG.tribunale)}</div><div class="t2">${esc(CONFIG.servizio)}</div><hr><div class="t3">RELAZIONE DI CONSULENZA PREGIUDIZIALE</div><div class="t4">${prot?"Prot. n. "+esc(prot)+" · ":""}Documento riservato</div></div>`;
  h+=`<p>Il sottoscritto ${esc(CONFIG.consulente)}, consulente del ${esc(CONFIG.servizio)}, riferisce quanto emerso dal colloquio pregiudiziale${val("proc.dataColl")?" svoltosi il "+esc(fmtDate(val("proc.dataColl"))):""}${val("proc.luogoColl")?" presso "+esc(val("proc.luogoColl")):""} con ${esc(nameD())}${parte?", in qualità di "+(parte==="Attore"?"parte attrice":"parte convenuta"):""}, in ordine al matrimonio contratto con ${(val("coni.nome")||val("coni.cognome"))?esc(nameC()):"l'altro coniuge"}.</p>`;

  // I. Dati
  h+=`<div class="r-h2">I. Dati delle parti e del matrimonio</div>`;
  let rows="";
  const row=(l,a,b)=>{ if(filled(a)||filled(b)) rows+=`<tr><td>${l}</td><td>${esc(a||"")}</td><td>${esc(b||"")}</td></tr>`; };
  row("Nascita",[fmtDate(val("dich.nascita")),val("dich.luogoNascita")].filter(Boolean).join(", "),[fmtDate(val("coni.nascita")),val("coni.luogoNascita")].filter(Boolean).join(", "));
  row("Residenza",[val("dich.indirizzo"),val("dich.citta")].filter(Boolean).join(", "),val("coni.residenza"));
  row("Titolo di studio",val("dich.studio"),"");
  row("Professione",val("dich.professione"),val("coni.professione"));
  row("Recapiti",[val("dich.tel"),val("dich.email")].filter(Boolean).join(" · "),val("coni.reperibile"));
  row("Battesimo",val("dich.battesimo"),val("coni.battezzato"));
  row("Parrocchia / diocesi",[val("dich.parrocchia"),val("dich.diocesi")].filter(Boolean).join(" – "),"");
  if(rows) h+=`<table class="r-tab" style="margin-bottom:10px"><tr><th style="width:24%"></th><th>${esc(nameD())} – dichiarante</th><th>${esc(nameC())} – coniuge</th></tr>${rows}</table>`;
  const mat=[];
  if(val("cel.dataNozze")) mat.push("celebrato il "+fmtDate(val("cel.dataNozze")));
  if(val("cel.luogoNozze")) mat.push("presso "+val("cel.luogoNozze"));
  if(val("cel.celebrante")) mat.push("ministro celebrante "+val("cel.celebrante"));
  if(val("cel.rito")) mat.push("forma: "+val("cel.rito").toLowerCase());
  if(mat.length) h+=`<p class="r-q"><span class="rq">Matrimonio:</span> ${esc(mat.join(", "))}.</p>`;
  if(val("cel.testiSposo")||val("cel.testiSposa")) h+=`<p class="r-q"><span class="rq">Testimoni di nozze:</span> ${esc([val("cel.testiSposo")&&"per lo sposo "+val("cel.testiSposo"), val("cel.testiSposa")&&"per la sposa "+val("cel.testiSposa")].filter(Boolean).join("; "))}.</p>`;
  const sep=[];
  if(val("vita.sepFatto")) sep.push("separazione di fatto "+fmtDate(val("vita.sepFatto")));
  if(val("vita.sepLegale")) sep.push("separazione legale "+fmtDate(val("vita.sepLegale")));
  if(val("vita.divorzio")) sep.push("divorzio "+fmtDate(val("vita.divorzio")));
  if(sep.length) h+=`<p class="r-q"><span class="rq">Separazione:</span> ${esc(sep.join("; "))}.${d?" Durata della convivenza coniugale: "+esc(d.txt)+".":""}</p>`;
  if(val("prole.figliComuni")) h+=`<p class="r-q"><span class="rq">Figli comuni:</span> ${answerText(S.find(s=>s.id==="prole"),S.find(s=>s.id==="prole").fields.find(f=>f.id==="figliComuni"),null)}</p>`;
  if(val("coni.atteggiamento")) h+=`<p class="r-q"><span class="rq">Atteggiamento prevedibile dell'altra parte:</span> ${esc(val("coni.atteggiamento"))}.</p>`;

  // II. Fatti
  h+=`<div class="r-h2">II. Esposizione dei fatti</div><p class="r-obs">Quanto segue riporta le dichiarazioni rese da ${esc(nameD())}; ciò che riguarda l'altro coniuge è riferito dal dichiarante.</p>`;
  const skip={cel:["dataNozze","luogoNozze","celebrante","rito","testiSposo","testiSposa"],vita:["sepFatto","sepLegale","divorzio"],prole:["figliComuni"]};
  for(const sid of FACT_SECTIONS){
    const s=S.find(x=>x.id===sid); let body="";

        if(a||b) body+=`<div class="r-q"><span class="rq">${esc(rlab(f.label))}</span><br>${a?`<u>${esc(nameD())}</u>: ${a}<br>`:""}${b?`<u>${esc(nameC())}</u>: ${b}`:""}</div>`;
      } else {
        const a=answerText(s,f,null);
        if(a) body+=`<div class="r-q"><span class="rq">${esc(rlab(f.label))}</span><br>${a}</div>`;
      }

    const note=val("_note."+sid);

  const keys=Object.keys(CAPI).filter(c=>by[c]);

  if(keys.length){
    h+=`<p class="r-obs">Quadro ricognitivo delle dichiarazioni, senza valutazione di merito.</p>`;
    for(const c of keys){
      h+=`<div class="r-h3">${esc(CAPI[c])}</div><ul>`+by[c].map(x=>{
        let t=esc(rlab(x.f.label).replace(/\?$/,""));
        if(x.side) t+=` – <i>${esc(x.side==="d"?nameD():nameC())}</i>`;
        if(x.f.type==="yn"){ if(x.t) t+=` (${esc(x.t.toLowerCase())})`; if(filled(x.det)) t+=`: ${nl2br(x.det)}`; }
        else if(x.det) t+=`: ${esc(x.det)}`;
        return `<li>${t}</li>`;
      }).join("")+`</ul>`;
    }
  } else h+=`<p>Dal colloquio non sono emersi elementi specificamente segnalati.</p>`;

  // IV. Art. 14
  const a14=Object.keys(ART14).filter(k=>state.a14[k]);
  if(a14.length){
    h+=`<div class="r-h2">IV. Circostanze di cui all'art. 14 §1 delle Regole procedurali</div><ul>`+a14.map(k=>`<li>${esc(ART14[k])}</li>`).join("")+`</ul>`;
  }
  // V. Testi
  const n=a14.length?["V","VI","VII"]:["IV","V","VI"];
  h+=`<div class="r-h2">${n[0]}. Persone informate sui fatti</div>`;
  if(state.testi.length){
    h+=`<table class="r-tab"><tr><th>Nome</th><th>Relazione · età · recapito</th><th>Conoscenza dei fatti</th></tr>`+
      state.testi.map(t=>`<tr><td>${esc(t.nome)}</td><td>${esc([t.rel,t.eta&&t.eta+" anni",t.recapito].filter(Boolean).join(" · "))}</td><td>${nl2br(t.sa)}${t.come?`<br><i>Fonte e tempo: ${esc(t.come)}</i>`:""}</td></tr>`).join("")+`</table>`;
  } else h+=`<p>Non indicate.</p>`;
  if(val("_note.testi") && (FORCE_NOTES||val("val.includiNote"))) h+=`<p class="r-obs">Osservazioni del consulente: ${nl2br(val("_note.testi"))}</p>`;
  // VI. Documenti
  h+=`<div class="r-h2">${n[1]}. Documentazione</div>`;

/* zip "store" con CRC32 */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  const u16=v=>[v&255,(v>>>8)&255], u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const f of files){
    const name=enc.encode(f.name), data=typeof f.data==="string"? enc.encode(f.data) : f.data, crc=crc32(data);
    const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(lh,name,data);
    cd.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),name);
    off+=lh.length+name.length+data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cdSize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cd,end],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* lettura di un .docx salvato dallo strumento (anche se riaperto e salvato da Word) */
async function unzipEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1; for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error("zip");
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const out=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("cd");
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    out.push({name,method,csize,off}); p+=46+nlen+elen+clen;
  }
  const read=async e=>{
    const ln=dv.getUint16(e.off+26,true), le=dv.getUint16(e.off+28,true), start=e.off+30+ln+le;
    const raw=u8.subarray(start,start+e.csize);
    if(e.method===0) return new TextDecoder().decode(raw);
    if(e.method===8){
      if(typeof DecompressionStream==="undefined") throw new Error("nodecomp");
      const ds=new DecompressionStream("deflate-raw");
      const stream=new Blob([raw]).stream().pipeThrough(ds);
      return await new Response(stream).text();
    }
    throw new Error("method");
  };
  return {entries:out, read};
}
async function readPraticaFromDocx(buf){
  const z=await unzipEntries(buf);
  for(const e of z.entries.filter(e=>/^customXml\/item\d+\.xml$/i.test(e.name))){
    const t=await z.read(e);
    if(t.includes(PRATICA_NS)){ const m=t.match(/<praticaColloquio[^>]*>([\s\S]*?)<\/praticaColloquio>/); if(m) return JSON.parse(utf8b64(m[1])); }
  }
  return null;
}

/* ================= FINESTRE DI DIALOGO INTERNE =================
   (al posto di confirm/alert, che alcune anteprime bloccano) */
function ask(msg, okLabel, cancelLabel){
  return new Promise(res=>{
    const bg=document.createElement("div"); bg.className="modal-bg noprint";
    bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="mb">${cancelLabel===null?"":`<button class="btn sec" data-r="0">${esc(cancelLabel||"Annulla")}</button>`}<button class="btn" data-r="1">${esc(okLabel||"OK")}</button></div></div>`;
    const done=v=>{ bg.remove(); document.removeEventListener("keydown",kd,true); res(v); };
    const kd=e=>{ if(e.key==="Escape"){ e.stopPropagation(); done(false); } };
    bg.addEventListener("click",e=>{ e.stopPropagation(); const b=e.target.closest("[data-r]"); if(b) done(b.dataset.r==="1"); else if(e.target===bg) done(false); });
    document.addEventListener("keydown",kd,true);
    document.body.appendChild(bg); bg.querySelector('[data-r="1"]').focus();
  });
}
const notify = msg => ask(msg,"OK",null);

/* ================= PROTOCOLLO ================= */
async function genProtocollo(){
  const attoreCon = val("proc.parte")==="Convenuto";   // se il dichiarante è convenuto, l'attore è l'altro coniuge
  const cogn = (attoreCon? val("coni.cognome") : val("dich.cognome")) || "";
  if(!cogn.trim()){
    notify("Per generare il protocollo serve il cognome dell'attore.\n\nIndichi se il dichiarante è attore o convenuto e inserisca il cognome nella sezione «"+(attoreCon?"L'altro coniuge":"Il dichiarante")+"».");
    return;
  }
  const d = val("proc.dataColl") || new Date().toISOString().slice(0,10);
  const prot = cogn.trim().replace(/\s+/g,"") + "_" + d.replace(/-/g,"/") + "_" + CONFIG.sigla;
  if(filled(val("proc.prot")) && val("proc.prot")!==prot && !(await ask("Sostituire il protocollo attuale «"+val("proc.prot")+"» con «"+prot+"»?","Sostituisci"))) return;
  state.v["proc.prot"]=prot; persist(); renderSection(); renderNav();
}

/* ================= ASPETTO (chiaro / scuro) ================= */
const TH_KEY="tep_colloquio_tema";
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function themePref(){ try{ return localStorage.getItem(TH_KEY)||"auto"; }catch(e){ return "auto"; } }
function applyTheme(){
  const p=themePref(), dark = p==="dark" || (p==="auto" && mq && mq.matches);
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  document.querySelectorAll("[data-theme-set]").forEach(b=>b.classList.toggle("on", b.dataset.themeSet===p));
}
if(mq){ (mq.addEventListener? mq.addEventListener("change",applyTheme) : mq.addListener(applyTheme)); }

/* ================= EVENTI ================= */
function go(to){ cur = to==="report"? "report" : +to; renderNav(); renderSection(); document.getElementById("main").scrollTop=0; }
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const ts=e.target.closest("[data-theme-set]"); if(ts){ try{ localStorage.setItem(TH_KEY, ts.dataset.themeSet); }catch(err){} applyTheme(); return; }
  const id=e.target.id;
  if(id==="genProt"){ genProtocollo(); return; }
  if(id==="addTest"){ state.testi.push({}); persist(); renderSection(); renderNav(); return; }
  if(e.target.dataset.deltest!=null){ const i=+e.target.dataset.deltest; ask("Rimuovere questa persona dall'elenco?","Rimuovi").then(ok=>{ if(ok){ state.testi.splice(i,1); persist(); renderSection(); renderNav(); } }); return; }
  if(id==="bozza"){ const put=()=>{ state.v["val.testo"]=bozza(); persist(); renderSection(); renderNav(); }; if(!filled(val("val.testo"))) put(); else ask("Sostituire il testo attuale della valutazione con una nuova bozza?","Sostituisci").then(ok=>{ if(ok) put(); }); return; }
  if(id==="bWord"){ exportWord(); return; }
  if(id==="bPrint"){ window.print(); return; }
  if(id==="bSave"){ salvaPratica(); return; }
  if(id==="bOpen"){ document.getElementById("fileIn").click(); return; }
  if(id==="bNew"){ ask("Iniziare una nuova pratica?\n\nIl modulo verrà svuotato: se non ha ancora usato «Salva pratica (Word)», i dati della pratica attuale andranno persi.","Inizia nuova pratica").then(ok=>{ if(ok){ state=blank(); persist(); go(0); setStatus("Nuova pratica iniziata"); } }); return; }
});
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value="";
  const apri=o=>{ state=Object.assign(blank(),o); persist(); go(0); setStatus("Pratica aperta: "+f.name); };
  const conferma=o=>{ if(filled(val("proc.prot"))||filled(val("dich.cognome"))) ask("Aprire la pratica «"+((o.v&&o.v["proc.prot"])||f.name)+"»?\n\nLa pratica ora sullo schermo verrà sostituita: se non l'ha salvata, i dati andranno persi.","Apri").then(ok=>{ if(ok) apri(o); }); else apri(o); };
  f.arrayBuffer().then(async buf=>{
    let o=null;
    try{
      if(/\.json$/i.test(f.name)) o=JSON.parse(new TextDecoder().decode(buf));
      else o=await readPraticaFromDocx(buf);
    }catch(err){
      if(String(err&&err.message)==="nodecomp"){ notify("Questo browser non riesce a leggere il file. Apra lo strumento con una versione aggiornata di Chrome, Edge, Firefox o Safari."); return; }
      o=null;
    }
    if(!o||!o.v){ notify("Il file «"+f.name+"» non contiene una pratica salvata con questo strumento.\n\nSi possono aprire solo i file creati con «Salva pratica (Word)». La relazione per il Tribunale non contiene i dati della pratica."); return; }
    conferma(o);
  });
});
function onField(e){
  const el=e.target;
  if(el.dataset.k){
    const k=el.dataset.k;
    if(el.dataset.multi){ const arr=new Set(Array.isArray(state.v[k])?state.v[k]:[]); el.checked?arr.add(el.value):arr.delete(el.value); state.v[k]=[...arr]; }
    else if(el.dataset.bool) state.v[k]=el.checked;
    else state.v[k]=el.value;
    persist();
    if(el.type==="radio"||el.type==="checkbox"){ if(e.type==="change"){ const y=document.getElementById("main").scrollTop; renderSection(); renderNav(); document.getElementById("main").scrollTop=y; } }
    else if(e.type==="change") renderNav();
  } else if(el.dataset.tk){
    const [i,f]=el.dataset.tk.split("."); state.testi[+i][f]=el.value; persist();
    if(e.type==="change") renderNav();
  } else if(el.dataset.a14){
    state.a14[el.dataset.a14]=el.checked; persist();
  }
}
document.addEventListener("input",e=>{ if(e.target.type!=="radio"&&e.target.type!=="checkbox") onField(e); });
document.addEventListener("change",onField);

window.addEventListener("pagehide",()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} });
window.addEventListener("beforeunload",()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} });
/* ================= IMPOSTAZIONI DEL CONSULENTE (per dispositivo) ================= */
const SET_KEY="tep_colloquio_impostazioni";
function loadSettings(){ try{ const o=JSON.parse(localStorage.getItem(SET_KEY)||"null"); if(o){ ["consulente","sigla","servizio","luogoFirma"].forEach(k=>{ if(o[k]) CONFIG[k]=o[k]; }); return true; } }catch(e){} return false; }
function showSettingsInBrand(){ document.getElementById("brandSub").textContent=CONFIG.servizio; document.getElementById("brandCons").textContent="Consulente: "+CONFIG.consulente+" ("+CONFIG.sigla+")"; }
function openSettings(primo){
  const bg=document.createElement("div"); bg.className="modal-bg noprint";
  const vuoto = primo ? {consulente:"",sigla:""} : {};
  const F=(k,l,h,ph)=>`<div class="fieldsm"><label>${l}</label><input type="text" data-set="${k}" placeholder="${esc(ph||"")}" value="${esc(k in vuoto? vuoto[k] : CONFIG[k])}">${h?`<div class="help" style="margin-top:3px">${h}</div>`:""}</div>`;
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-width:520px"><h2>Impostazioni del consulente</h2><p style="margin-bottom:12px;color:var(--muted);font-size:13.5px">${primo?"Prima di iniziare, inserisca i suoi dati: compariranno nelle relazioni e nel protocollo. ":""}Restano memorizzati su questo dispositivo e si possono cambiare in ogni momento.</p>
  ${F("consulente","Nome del consulente, come deve comparire nella firma","Es. «d. Mario Ansaldi», «dott.ssa Anna Rossi»","Titolo, nome e cognome")}
  ${F("sigla","Sigla per il protocollo","Le iniziali, es. MA","Iniziali")}
  ${F("servizio","Servizio di appartenenza")}
  ${F("luogoFirma","Luogo di redazione della relazione")}
  <div class="mb">${primo?"":`<button class="btn sec" data-r="0">Annulla</button>`}<button class="btn" data-r="1">Salva impostazioni</button></div></div>`;
  const close=()=>bg.remove();
  bg.addEventListener("click",e=>{
    e.stopPropagation();
    const b=e.target.closest("[data-r]"); if(!b) return;
    if(b.dataset.r==="1"){
      const o={}; bg.querySelectorAll("[data-set]").forEach(i=>o[i.dataset.set]=i.value.trim());
      if(!o.consulente||!o.sigla){ bg.querySelector(o.consulente?'[data-set="sigla"]':'[data-set="consulente"]').focus(); return; }
      o.sigla=o.sigla.toUpperCase().replace(/[^A-Z0-9]/g,"");
      Object.assign(CONFIG,o); try{ localStorage.setItem(SET_KEY,JSON.stringify(o)); }catch(err){}
      showSettingsInBrand(); if(cur==="report") renderSection(); setStatus("Impostazioni salvate");
    }
    close();
  });
  document.body.appendChild(bg); bg.querySelector("[data-set]").focus();
}
document.getElementById("bSet").addEventListener("click",e=>{ e.stopPropagation(); openSettings(false); });

/* ================= VERSIONE WEB: funzionamento offline e installazione ================= */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel="manifest"]')){
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

applyTheme();
document.getElementById("brandLogo").src=LOGO;
const haSettings=loadSettings(); showSettingsInBrand();
load(); go(0);
if(!haSettings) openSettings(true);
</script>
</body>
</html>
